name: Rename LeetCode Folders

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    # Don't run on commits created by this workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rename folders
        run: python rename.py

      - name: Commit renamed folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          # Get the commit message that triggered this workflow
          PREVIOUS_COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          echo "Using commit message:"
          echo "$PREVIOUS_COMMIT_MESSAGE"

          # Commit using the same message
          git commit -m "${PREVIOUS_COMMIT_MESSAGE} [skip ci]"

          git push
